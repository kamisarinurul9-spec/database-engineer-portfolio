services:
  patroni-postgres:
    image: ghcr.io/zalando/spilo-16:3.2-p3
    container_name: patroni_pg_133
    privileged: true
    ports:
      - "5432:5432"
      - "8008:8008"
    environment:
      - PG_HBA=host all all 0.0.0.0/0 trust, host replication all 0.0.0.0/0 trust
      # Perhatikan name: node_133 di bawah ini
      - PATRONI_CONFIGURATION={"consul":{"host":"10.204.20.134:8500"},"scope":"pg_cluster","name":"node_133","postgresql":{"connect_address":"10.204.20.133:5432","pg_hba":["host all all 0.0.0.0/0 trust","host replication all 0.0.0.0/0 trust","local all all trust"]},"restapi":{"connect_address":"10.204.20.133:8008"}} #SESUAIKAN IP CONSUL
      - DOCKER_IP=10.204.20.133 #SESUAIKAN IP
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_CONNECT_ADDRESS=10.204.20.133:8008 #SESUAIKAN IP
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=10.204.20.133:5432 #SESUAIKAN IP
      - PATRONI_POSTGRESQL_DATA_DIR=/home/postgres/pgdata/pgroot
      - PATRONI_REPLICATION_USERNAME=replicator #SESUAIKAN USERNAME
      - PATRONI_REPLICATION_PASSWORD=repl_password #SESUAIKAN USERNAME
      - PATRONI_SUPERUSER_USERNAME=postgres #SESUAIKAN USERNAME
      - PATRONI_SUPERUSER_PASSWORD=password #SESUAIKAN PASSWORD
      - SCOPE=pg_cluster
    volumes:
      - pg_data_133:/home/postgres/pgdata
      - ./fix_hba.sh:/docker-entrypoint-initdb.d/fix_hba.sh
volumes:
  pg_data_133:
