version: '3.5'

x-docker-data: &clickhouse-service
  image: clickhouse/clickhouse-server:25.3-alpine
  user: "101:101"
  extra_hosts:
      - "clickhouse-01:10.206.27.145"
      - "clickhouse-keeper-01:10.206.27.145"
      - "clickhouse-keeper-02:10.206.27.147"
      - "clickhouse-keeper-03:10.206.27.144"

services:
  clickhouse-02:
    <<: *clickhouse-service
    container_name: clickhouse-02
    hostname: clickhouse-02
    volumes:
      - ./config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cxluster.xml
      - ./config/macros-02.xml:/etc/clickhouse-server/config.d/macros.xml
      - ./config/storage.xml://etc/clickhouse-server/config.d/storage.xml
      - ./config/users.xml:/etc/clickhouse-server/users.d/users.xml
      - clickhouse-data-02:/var/lib/clickhouse
      - clickhouse-log-02:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"

  clickhouse-keeper-02:
    <<: *clickhouse-service
    container_name: clickhouse-keeper-02
    image: clickhouse/clickhouse-keeper:25.3-alpine
    hostname: clickhouse-keeper-02
    volumes:
      - ./config/keeper-02.xml:/etc/clickhouse-keeper/keeper_config.xml
      - clickhouse-keeper:/var/lib/clickhouse
    ports:
      - "9181:9181"
      - "9234:9234"

volumes:
  clickhouse-data-02:
  clickhouse-log-02:
  clickhouse-keeper:
