version: "3.9"

services:
  proxysql:
    container_name: proxysql-service
    image: proxysql/proxysql:2.6.3
    restart: always
    ports:
      - "6033:6033" # Port aplikasi (MySQL Protocol)
      - "6032:6032" # Port Admin (Interface SQL)
    volumes:
      - ./proxysql_data:/var/lib/proxysql
      - ./proxysql.cnf:/etc/proxysql.cnf
    environment:
      TZ: Asia/Jakarta
